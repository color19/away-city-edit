<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>away · 城市精选</title>
<style>
:root{--bg:#f7f6f0;--card:#fff;--ink:#183f36;--mute:#79847a;--chip:#ecefe6;--line:#dfe4d6;--accent:#183f36;--onaccent:#fff;--good:#2e7d5b;--warn:#a04a37;--mid:#b07d1e}
@media (prefers-color-scheme:dark){:root{--bg:#101a17;--card:#17251f;--ink:#e6efe9;--mute:#93a39a;--chip:#20322b;--line:#2a3d35;--accent:#8fd0b0;--onaccent:#0b1a14;--good:#7ed1a6;--warn:#e69a86;--mid:#e0b45a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
.app{max-width:520px;margin:0 auto;padding:20px 16px 110px}
header{display:flex;align-items:baseline;gap:10px}
.logo{font-size:34px;font-weight:800;letter-spacing:-1.5px}
.logo i{color:#a6b98f;font-style:normal}
.sub{font-size:12px;letter-spacing:3px;color:var(--mute)}
h1{font-size:30px;line-height:1.2;letter-spacing:-.5px;margin:22px 0 6px}
.lead{color:var(--mute);margin:0 0 18px}
.origin{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px;margin-bottom:18px}
.origin small{display:block;color:var(--mute);font-size:12px}
.label{font-size:12px;letter-spacing:2px;color:var(--mute);margin:18px 0 8px;font-weight:600}
.label em{font-style:normal;letter-spacing:0;font-weight:400}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);padding:9px 16px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--onaccent)}
.chip:disabled{opacity:.4;cursor:default}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.filters label{font-size:12px;color:var(--mute);display:block}
.filters input,.filters select{width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.note{background:#eef0e2;color:#4b5a4b;border-radius:14px;padding:12px 14px;font-size:13px;margin:16px 0}
@media (prefers-color-scheme:dark){.note{background:#1c2b25;color:#a8b9af}}
.card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.rank{font-size:13px;color:var(--mute);width:18px}
.grow{flex:1;min-width:0}
.city{font-size:18px;font-weight:700}
.meta{font-size:13px;color:var(--mute)}
.why{font-size:13px;margin-top:4px}
.price{font-size:22px;font-weight:800;text-align:right}
.tag{font-size:11px;border-radius:6px;padding:1px 7px;margin-left:6px;background:var(--chip);font-weight:400}
.tag.ns{background:var(--good);color:#fff}
.worth{flex:none;width:54px;text-align:center}
.worth b{display:block;font-size:24px;line-height:1.1}
.worth small{font-size:11px}
.w-hi{color:var(--good)}.w-mid{color:var(--mid)}.w-lo{color:var(--warn)}
.empty{text-align:center;padding:38px 10px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.on{display:flex}
.panel{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:24px 20px 32px}
.panel h2{margin:0;font-size:30px;letter-spacing:-.5px}
.region{font-size:12px;letter-spacing:2px;color:var(--mute)}
.big{font-size:40px;font-weight:800;margin:14px 0 2px}
.rowl{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.rowl span:first-child{color:var(--mute)}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.bar span:first-child{width:36px;color:var(--mute)}
.bar i{flex:1;height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.bar i b{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar span:last-child{width:22px;text-align:right}
.calc{font-size:13px;color:var(--mute);background:var(--chip);border-radius:12px;padding:10px 12px;margin-top:12px}
.btn{display:block;text-align:center;background:var(--accent);color:var(--onaccent);border-radius:14px;padding:14px;font-weight:700;text-decoration:none;margin-top:18px}
.close{background:none;border:0;color:var(--mute);font:inherit;margin-top:10px;width:100%;padding:8px;cursor:pointer}
footer{color:var(--mute);font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div class="app">
  <header><span class="logo">away<i>.</i></span><span class="sub">城市精选</span></header>
  <h1>不只是便宜，是值得去</h1>
  <p class="lead">把真实报价、城市体验和出发季节放在一起，告诉你哪里值得飞。</p>

  <div class="origin"><small>出发地</small><b>华盛顿 · IAD（杜勒斯）</b></div>

  <div class="label">出发月份</div>
  <div class="chips" id="months"></div>
  <div class="label">目的地大洲</div>
  <div class="chips" id="regions"></div>
  <div class="label">你更在意什么 <em>（可多选，不选则四项同等看待）</em></div>
  <div class="chips" id="dims"></div>

  <div class="label">筛选</div>
  <div class="filters">
    <div><label for="budget">往返预算（美元）</label><input id="budget" type="number" inputmode="numeric" min="0"></div>
    <div><label for="stops">中转</label>
      <select id="stops"><option value="0">仅直飞</option><option value="1">最多 1 次中转</option><option value="2">不限</option></select></div>
    <div><label for="hours">单程时长上限（小时）</label><input id="hours" type="number" inputmode="numeric" min="1"></div>
    <div><label for="sort">排序</label>
      <select id="sort"><option value="worth">值得度最高</option><option value="price">价格最低</option><option value="nonstop">直飞优先</option><option value="time">飞行最短</option></select></div>
    <div><label for="top">显示数量</label>
      <select id="top"><option>5</option><option>10</option><option>20</option><option value="100">全部</option></select></div>
  </div>

  <div class="note" id="note"></div>
  <div id="list"></div>
  <footer id="foot"></footer>
</div>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

<script src="data/cities.js"></script>
<script src="data/profiles.js"></script>
<script src="data/fares.js"></script>
<script>
const REGION_ZH={Europe:"欧洲",Asia:"亚洲","South America":"南美洲",Oceania:"大洋洲",Africa:"非洲"};
const DIMS=[["f","美食"],["c","文化"],["n","自然"],["v","氛围"]];
const DEFAULTS={month:"all",region:"All",dims:[],budget:1300,stops:1,hours:15,sort:"worth",top:10};
const KEY="away.prefs.v2";
let P={...DEFAULTS};
try{Object.assign(P,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
const $=id=>document.getElementById(id);
const cityByCode=Object.fromEntries(CITIES.map(c=>[c.iata,c]));
const rows=FARES.rows.map(r=>({...r,city:cityByCode[r.code]})).filter(r=>r.city&&PROFILES[r.city.city]);
const hasMonth=new Set(rows.map(r=>r.depart.slice(0,7)));
const months=(()=>{const c=new Date(FARES.capturedAt+"T00:00:00"),o=[];for(let i=0;i<6;i++){const d=new Date(c.getFullYear(),c.getMonth()+i,1);o.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"))}return o})();
const fmtH=m=>`${Math.floor(m/60)}小时${m%60?String(m%60).padStart(2,"0")+"分":""}`;
const stopTxt=s=>s===0?"直飞":s===1?"1 次中转":`${s} 次中转`;
const median=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const medianByRegion={};
for(const reg of Object.keys(REGION_ZH)){const p=rows.filter(r=>r.city.region===reg).map(r=>r.price);if(p.length)medianByRegion[reg]=median(p)}

// 值得度 = 体验分 × 季节系数 × 价格系数（0.8–1.2），满分 100
function score(r){
  const p=PROFILES[r.city.city];
  const use=P.dims.length?DIMS.filter(d=>P.dims.includes(d[0])):DIMS;
  const exp=use.reduce((s,d)=>s+p[d[0]],0)/use.length*10;
  const mon=+r.depart.slice(5,7);
  const inSeason=p.m.includes(mon);
  const adj=p.m.includes(mon%12+1)||p.m.includes((mon+10)%12+1);
  const season=inSeason?1:adj?0.9:0.75;
  const med=medianByRegion[r.city.region];
  const pf=Math.min(1.2,Math.max(0.8,Math.pow(med/r.price,0.35)));
  const total=Math.min(100,Math.round(exp*season*pf));
  return {exp:Math.round(exp),season,seasonTxt:inSeason?"正当季":adj?"接近旺季":"非最佳季节",pf:+pf.toFixed(2),med,total,use,mon};
}
const grade=t=>t>=75?["强烈推荐","w-hi"]:t>=60?["值得去","w-hi"]:t>=45?["看情况","w-mid"]:["不太划算","w-lo"];
function reason(r,s){
  const p=PROFILES[r.city.city];
  const top=[...s.use].sort((a,b)=>p[b[0]]-p[a[0]]).slice(0,2).map(d=>`${d[1]}${p[d[0]]}`).join("、");
  const diff=Math.round((1-r.price/s.med)*100);
  const price=Math.abs(diff)<3?"价格接近同区中位价":diff>0?`比同区中位价低 ${diff}%`:`比同区中位价高 ${-diff}%`;
  return `${top} · ${s.seasonTxt} · ${price}`;
}

function chips(el,items,cur,on){
  el.innerHTML="";
  items.forEach(([v,t,dis])=>{
    const b=document.createElement("button");b.className="chip";b.textContent=t;
    const pressed=Array.isArray(cur)?cur.includes(v):v===cur;
    b.setAttribute("aria-pressed",String(pressed));b.disabled=!!dis;
    b.onclick=()=>on(v);el.appendChild(b);
  });
}
const monthLabel=m=>{const [y,mm]=m.split("-");return `${y}年${+mm}月`};

function render(){
  chips($("months"),[["all","未来 6 个月"],...months.map(m=>[m,monthLabel(m),!hasMonth.has(m)])],P.month,v=>{P.month=v;save();render()});
  chips($("regions"),["All",...Object.keys(REGION_ZH)].map(r=>[r,r==="All"?"全部":REGION_ZH[r],r!=="All"&&!rows.some(x=>x.city.region===r)]),P.region,v=>{P.region=v;save();render()});
  chips($("dims"),DIMS.map(d=>[d[0],d[1]]),P.dims,k=>{P.dims=P.dims.includes(k)?P.dims.filter(x=>x!==k):[...P.dims,k];save();render()});
  $("budget").value=P.budget;$("stops").value=P.stops;$("hours").value=P.hours;$("sort").value=P.sort;$("top").value=P.top;

  let list=rows.filter(r=>
    (P.month==="all"||r.depart.startsWith(P.month))&&
    (P.region==="All"||r.city.region===P.region)&&
    r.stops<=P.stops&&r.price<=P.budget&&r.minutes<=P.hours*60).map(r=>({r,s:score(r)}));
  const cmp={worth:(a,b)=>b.s.total-a.s.total||a.r.price-b.r.price,price:(a,b)=>a.r.price-b.r.price,nonstop:(a,b)=>a.r.stops-b.r.stops||a.r.price-b.r.price,time:(a,b)=>a.r.minutes-b.r.minutes||a.r.price-b.r.price}[P.sort];
  list.sort(cmp);
  const shown=list.slice(0,+P.top);

  $("note").textContent=`价格来自 ${FARES.source}，${FARES.capturedAt} 采集。${FARES.note}。快照价格不等于实时可订价，下单前请核对。`;
  $("list").innerHTML=shown.length?"":`<div class="empty"><b>没有符合条件的目的地</b>试试放宽预算、中转次数或时长；也可能是这个月份、大洲暂时还没有数据。</div>`;
  shown.forEach(({r,s},i)=>{
    const [g,cls]=grade(s.total);
    const b=document.createElement("button");b.className="card";
    b.innerHTML=`<span class="rank">${i+1}</span>
      <span class="worth ${cls}"><b>${s.total}</b><small>${g}</small></span>
      <span class="grow"><span class="city">${r.city.city}<span class="tag ${r.stops===0?"ns":""}">${stopTxt(r.stops)}</span></span><br>
      <span class="meta">${r.city.iata} · ${r.label} · ${fmtH(r.minutes)}</span>
      <div class="why">${reason(r,s)}</div></span>
      <span class="price">$${r.price}</span>`;
    b.onclick=()=>detail(r,s);$("list").appendChild(b);
  });
  const withData=new Set(rows.map(r=>r.code)).size;
  $("foot").textContent=`城市库 ${CITIES.length} 个城市，其中 ${withData} 个已有真实报价，缺失的不会用估算价补齐。体验评分为编辑主观打分，可在 data/profiles.js 中修改。`;
}

function detail(r,s){
  const p=PROFILES[r.city.city];
  const q=encodeURIComponent(`Flights from IAD to ${r.code} on ${r.depart}`);
  const [g,cls]=grade(s.total);
  const mlist=p.m.map(m=>`${m}月`).join("、");
  $("panel").innerHTML=`<div class="region">${REGION_ZH[r.city.region].toUpperCase()}</div><h2>${r.city.city}</h2>
   <div class="meta" style="margin-top:4px">${p.tag}</div>
   <div style="display:flex;justify-content:space-between;align-items:flex-end">
     <div><div class="big">$${r.price}</div><div class="meta">往返 · 每人 · 含税 · 经济舱</div></div>
     <div class="worth ${cls}" style="width:auto"><b style="font-size:40px">${s.total}</b><small>${g}</small></div></div>
   <div style="margin-top:14px">${DIMS.map(d=>`<div class="bar"><span>${d[1]}</span><i><b style="width:${p[d[0]]*10}%"></b></i><span>${p[d[0]]}</span></div>`).join("")}</div>
   <div class="calc">值得度 ${s.total} = 体验分 ${s.exp} × 季节系数 ${s.season}（${s.seasonTxt}，${s.mon}月出发）× 价格系数 ${s.pf}（同区中位价 $${Math.round(s.med)}）。<br>推荐月份：${mlist}。体验分为编辑主观评分。</div>
   <div style="margin-top:12px">
    <div class="rowl"><span>出发日期</span><span>${r.label}</span></div>
    <div class="rowl"><span>中转</span><span>${stopTxt(r.stops)}</span></div>
    <div class="rowl"><span>单程时长</span><span>${fmtH(r.minutes)}</span></div>
    <div class="rowl"><span>报价采集</span><span>${FARES.capturedAt}</span></div></div>
   <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/travel/flights?q=${q}&curr=USD">在 Google Flights 查看最新价格</a>
   <button class="close" id="close">关闭</button>`;
  $("sheet").classList.add("on");$("close").onclick=closeSheet;
}
const closeSheet=()=>$("sheet").classList.remove("on");
$("sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
[["budget","budget"],["stops","stops"],["hours","hours"],["sort","sort"],["top","top"]].forEach(([id,k])=>{
  $(id).onchange=()=>{const v=$(id).value;P[k]=k==="sort"?v:(Number(v)||DEFAULTS[k]);save();render()};
});
render();
</script>
</body>
</html>
